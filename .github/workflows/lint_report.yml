name: Android Lint

on:
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  android-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: gradle
      - run: ./gradlew lint
      - uses: github/codeql-action/upload-sarif@v3
        if: success() || failure()
        with:
          sarif_file: Hoodies-Network/build/reports/lint-results-debug.sarif
          category: lint
