name: Release Build and Publish

on:
  push:
    branches: [ release/** ]

permissions:
  contents: write
  packages: write

jobs:
  build_and_publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build AAR and API reference
        run: ./gradlew :Hoodies-Network:assembleRelease :Hoodies-Network:dokkaHtml

      - name: Publish to GitHub Package Registry
        run: ./gradlew :Hoodies-Network:publishReleasePublicationToGitHubPackagesRepository
        env:
          GPR_USER: ${{ github.actor }}
          GPR_KEY: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish API reference to gh-pages
        uses: peaceiris/actions-gh-pages@v4.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: Hoodies-Network/build/dokka/html
          destination_dir: javadoc
          keep_files: true
          commit_message: Publishing a new javadoc
