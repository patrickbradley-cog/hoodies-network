name: CI

on:
  pull_request:
  push:
    branches: [ main, migration/** ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build, lint, apiCheck, docs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build, lint, apiCheck, docs, publish to Maven local
        run: >
          ./gradlew
          :Hoodies-Network:assembleDebug
          :Hoodies-Network:assembleRelease
          :Hoodies-Network:assembleDebugAndroidTest
          :Hoodies-Network:lintDebug
          :Hoodies-Network:apiCheck
          :Hoodies-Network:dokkaHtml
          :Hoodies-Network:publishToMavenLocal

      - name: Upload lint SARIF
        if: ${{ !cancelled() && hashFiles('Hoodies-Network/build/reports/lint-results-debug.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: Hoodies-Network/build/reports/lint-results-debug.sarif
          category: lint

      - name: Upload lint reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: Hoodies-Network/build/reports/lint-results-debug.*
          if-no-files-found: warn

      - name: Upload API dump
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: api-dump
          path: |
            Hoodies-Network/api/
            Hoodies-Network/build/api/
          if-no-files-found: warn

      - name: Upload Dokka HTML
        uses: actions/upload-artifact@v4
        with:
          name: dokka-html
          path: Hoodies-Network/build/dokka/html/

      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: aar
          path: Hoodies-Network/build/outputs/aar/

  instrumented-tests:
    name: Instrumented tests (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        api-level: [ 28, 35 ]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build app and test APKs
        run: ./gradlew :Hoodies-Network:assembleDebug :Hoodies-Network:assembleDebugAndroidTest

      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ matrix.api-level }}-google_apis-x86_64

      - name: Create AVD snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: ReactiveCircus/android-emulator-runner@v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      - name: Instrumented tests with coverage
        uses: ReactiveCircus/android-emulator-runner@v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew :Hoodies-Network:createDebugCoverageReport

      - name: Upload JUnit XML
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: junit-api${{ matrix.api-level }}
          path: Hoodies-Network/build/outputs/androidTest-results/connected/
          if-no-files-found: warn

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-api${{ matrix.api-level }}
          path: Hoodies-Network/build/reports/coverage/androidTest/debug/connected/
          if-no-files-found: warn

      - name: Coverage report to PR
        id: jacoco
        if: ${{ github.event_name == 'pull_request' && matrix.api-level == 28 }}
        uses: madrapps/jacoco-report@v1.7.2
        with:
          paths: ${{ github.workspace }}/Hoodies-Network/build/reports/coverage/androidTest/debug/connected/report.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 80
          min-coverage-changed-files: 0
          update-comment: true
          title: Test Coverage Report

      - name: Fail if overall coverage is below 80%
        if: ${{ github.event_name == 'pull_request' && matrix.api-level == 28 }}
        env:
          COVERAGE: ${{ steps.jacoco.outputs.coverage-overall }}
        run: |
          echo "Total coverage ${COVERAGE}%"
          python3 -c "import sys; sys.exit(0 if float('${COVERAGE}') >= 80.0 else 'Overall coverage is less than 80%!')"
