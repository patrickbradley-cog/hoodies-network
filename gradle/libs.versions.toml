[versions]
agp = "8.13.2"
kotlin = "2.4.20"
dokka = "1.9.20"
grgit = "5.3.3"
gitPublish = "5.1.3"
bcv = "0.18.2"
jacoco = "0.8.14"
coreKtx = "1.6.0"
appcompat = "1.3.1"
material = "1.4.0"
coroutines = "1.3.9"
gson = "2.8.8"
room = "2.4.2"
junit = "4.12"
androidxTestCore = "1.4.0"
androidxTestExtJunit = "1.1.3"
espresso = "3.4.0"
mockitoAndroid = "4.8.0"
objenesis = "2.6"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
material = { module = "com.google.android.material:material", version.ref = "material" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTestCore" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }
androidx-test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
mockito-android = { module = "org.mockito:mockito-android", version.ref = "mockitoAndroid" }
objenesis = { module = "org.objenesis:objenesis", version.ref = "objenesis" }

[plugins]
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-kapt = { id = "org.jetbrains.kotlin.kapt", version.ref = "kotlin" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
grgit = { id = "org.ajoberstar.grgit", version.ref = "grgit" }
git-publish = { id = "org.ajoberstar.git-publish", version.ref = "gitPublish" }
binary-compatibility-validator = { id = "org.jetbrains.kotlinx.binary-compatibility-validator", version.ref = "bcv" }
